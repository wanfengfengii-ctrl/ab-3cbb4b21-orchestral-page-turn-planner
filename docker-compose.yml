name: orchestra-pager

services:
  api:
    build: ./api
    image: orchestra-pager-api
    ports:
      - "${API_PORT:-8080}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  web:
    build: ./web
    image: orchestra-pager-web
    ports:
      - "${WEB_PORT:-8081}:80"
    depends_on:
      api:
        condition: service_started

  verify:
    build: ./verify
    image: orchestra-pager-verify
    environment:
      API_URL: http://api:8000
      WEB_URL: http://web
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
